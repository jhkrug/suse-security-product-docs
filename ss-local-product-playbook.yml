site:
  title: SUSE Security
  start_page: 1.0@kubewarden:en:introduction.adoc

content:
  sources:
    - url: ./
      branches: HEAD
      start_paths: [
        shared,
        docs/kw/version-*,
        docs/admission-controller/version-*,
        docs/sbom-scanner/version-*,
        docs/runtime-enforcer/version-*,
        docs/network-enforcer/version-*
        ]

ui:
  bundle:
    url: https://github.com/SUSEdoc/dsc-style-bundle/blob/main/default-ui/ui-bundle.zip?raw=true
    snapshot: true
  supplemental_files: ./dsc-style-bundle/supplemental-files/rancher

asciidoc:
  attributes:
    build-type: product
    # Log a warning for every reference to an undefined attribute.
    attribute-missing: warn
    page-pagination: ''
    tabs-sync-option: ''
  extensions:
    - '@asciidoctor/tabs'

antora:
  extensions:
    - require: '@antora/lunr-extension'
      index_latest_only: false
      index_by_heading: true
      languages: [en, de, es, fr, pt, ja, zh]
    - require: '@sntke/antora-mermaid-extension'
      mermaid_library_url: https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs
      script_stem: header-scripts
      mermaid_initialize_options:
    - require: ./product-docs-common/extensions/dynamic-loading-attributes/load-global-site-attributes.js
      attributefile: ./product-docs-common/global-attributes.yml
      enabled: true
    - require: ./product-docs-common/extensions/versions-latest-prerelease/vlp.js
      enabled: true

output:
  dir: build/site
